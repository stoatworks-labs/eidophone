  <body>
    <main id="demo">
      <noscript>
        <h1>Eidophone</h1>
        <p>
          An FFGL source that's a metal plate seen from above with sand on it, and an effect that
          prints your clip on the plate under the sand, both sounded by the music. Nothing is
          drawn. A free plate, square or round, is pushed at a point by a force that follows the
          music's pitch and loudness, and answers in its own modes, each a damped resonator. A
          grain can leave the plate only where the plate's acceleration beats gravity, so the sand
          is thrown off everywhere but the nodal lines and gathers there into Chladni's figures: a
          new note half-redraws the old figure, a quiet passage freezes it exactly, and fine powder
          heaps up the other way, at the antinodes.
        </p>
        <p>
          This demo runs the plugin's own C++, compiled to WebAssembly, and its shaders in your
          browser, so it needs JavaScript and WebGL2. It never uses a microphone.
        </p>
        <ul>
          <li><a href="https://github.com/stoatworks-labs/eidophone">Source on GitHub</a></li>
        </ul>
      </noscript>
